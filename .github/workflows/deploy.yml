name: Deploy static portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build pinned Lumen components
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run build:ui
          git diff --exit-code -- site/assets
      - name: Check static pages
        run: |
          python3 tools/build_case_studies.py
          git diff --exit-code -- site/index.html site/en/index.html site/projects site/en/projects site/img/projects
          python3 tools/check_site.py
          python3 tools/check_design.py
      - name: Check interactions
        run: node tools/check_interactions.cjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
